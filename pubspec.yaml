name: noor_al_huda
description: "A serene, comprehensive Islamic companion Flutter application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  google_fonts: ^6.2.1
  adhan: ^2.0.0-nullsafety.1
  geolocator: ^13.0.1
  sensors_plus: ^7.1.1
  just_audio: ^0.9.40
  vibration: ^2.0.0
  shared_preferences: ^2.3.2
  flutter_compass: ^0.8.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
